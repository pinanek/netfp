[package]
name = "netfp"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"

description = "Rust primitives and implementations for network fingerprinting"
documentation = "https://docs.rs/netfp"
readme = "README.md"
repository = "https://github.com/pinanek/netfp"
license = "MIT"
keywords = ["fingerprinting", "jarm", "network", "security", "tls"]
categories = ["network-programming", "parser-implementations"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**"]

[dependencies]
md-5 = { version = "0.11.0", optional = true }
rand = "0.10.2"
sha2 = { version = "0.11.0", optional = true }

[features]
default = ["ja3", "jarm"]

ja3 = ["dep:md-5"]
jarm = ["dep:sha2"]
